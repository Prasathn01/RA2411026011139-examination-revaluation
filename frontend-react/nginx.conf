# Serves the React build and forwards /api to the Spring Boot container,
# so the browser only ever talks to one address (no CORS needed).
server {
    listen 80;

    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
    }

    # React Router: unknown paths (for example /applications/APP-...) return index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
